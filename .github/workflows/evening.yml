name: Evening
on:
  # 2026-09-17 停用定时触发：本仓库是公开演示版，没有 corpus 也没有 secrets，
  # 定时跑只会在时间窗内崩在 "ENOENT: scandir .../corpus" 并触发 GitHub 失败通知。
  # 需要演示时用 workflow_dispatch 手动触发。
  workflow_dispatch: {}

# push 回写需要 contents: write（新仓库 GITHUB_TOKEN 默认只读）
permissions:
  contents: write

# 防 schedule 与手动 dispatch 撞车并发写同一日记
concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # ≥20.11（import.meta.dirname 依赖）
      - name: Run evening flow
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          DAILY_ROOT: ${{ github.workspace }}
        run: node scripts/evening.mjs
      - name: Commit changes
        run: |
          git config user.name "daily-bot"
          git config user.email "bot@daily-review.local"
          git add -A
          git commit -m "auto: evening run $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
      - name: Notify failure
        if: failure()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          DAILY_ROOT: ${{ github.workspace }}
          FAIL_MSG: "晚间流程失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node scripts/notify-fail.mjs
